# Publish `site/` to GitHub Pages.
#
# WHY actions/deploy-pages here, when the app repo deliberately does NOT:
# CallersCompendium publishes via a branch push, because two independent writers
# share its gh-pages branch — the landing page and the release pipeline's update
# manifests — so a whole-site replace would clobber one of them.
#
# This repository has no such split: the site, generated collection archives,
# manifest, and signature are all one artifact generated from content tracked
# here. That avoids the entire preserve/prune class of
# bug the app repo has to guard against.
#
# CUSTOM DOMAIN: once DNS for analect.callerscompendium.com is live and the
# domain is set in repo settings, add `site/CNAME` containing that hostname.
# Because the whole artifact is the published state, a CNAME that is not in the
# artifact will be dropped on the next deploy and GitHub will silently clear the
# custom-domain setting — this is exactly the failure CallersCompendium#863
# fixed. Keeping the file in `site/` makes the domain declarative and immune to
# it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - collections/**
      - tools/publish_collections.py
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time; don't cancel a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sign:
    name: Build signed collection feed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: signing
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: remove after the signing environment key has been pinned.
      - name: Print derived signing public key
        env:
          ANALECT_SIGNING_KEY_B64: ${{ secrets.ANALECT_SIGNING_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          sys.path.insert(0, "tools")
          from publish_collections import (
              _decode_signing_key,
              _normalize_base64_signing_key,
              _public_key_from_private,
          )

          key_bytes = _normalize_base64_signing_key(
              _decode_signing_key(os.environ["ANALECT_SIGNING_KEY_B64"])
          )
          with tempfile.TemporaryDirectory() as directory:
              directory = pathlib.Path(directory)
              source = directory / "signing-key"
              source.write_bytes(key_bytes)
              if key_bytes.startswith(b"-----BEGIN"):
                  key_path = source
              else:
                  key_path = directory / "signing-key.pem"
                  subprocess.run(
                      [
                          "openssl",
                          "pkey",
                          "-inform",
                          "DER",
                          "-in",
                          str(source),
                          "-out",
                          str(key_path),
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
              print("Derived signing public key (base64):")
              print(_public_key_from_private(key_path))

      - name: Generate signed collection feed
        env:
          ANALECT_SIGNING_KEY_B64: ${{ secrets.ANALECT_SIGNING_KEY_B64 }}
        run: |
          python3 tools/publish_collections.py --sign --output site
          test -s site/collections/manifest.json
          test -s site/collections/manifest.json.sig
          test -s site/collections/foda-1-1/archive.json

      - name: Upload site and collection feed
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy site
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
