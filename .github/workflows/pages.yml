# Publish `site/` to GitHub Pages.
#
# WHY actions/deploy-pages here, when the app repo deliberately does NOT:
# CallersCompendium publishes via a branch push, because two independent writers
# share its gh-pages branch — the landing page and the release pipeline's update
# manifests — so a whole-site replace would clobber one of them.
#
# This repository has no such split: the site AND (in future) the collection
# manifest are both generated from content tracked here, so a single artifact is
# the complete published state. That avoids the entire preserve/prune class of
# bug the app repo has to guard against.
#
# CUSTOM DOMAIN: once DNS for analect.callerscompendium.com is live and the
# domain is set in repo settings, add `site/CNAME` containing that hostname.
# Because the whole artifact is the published state, a CNAME that is not in the
# artifact will be dropped on the next deploy and GitHub will silently clear the
# custom-domain setting — this is exactly the failure CallersCompendium#863
# fixed. Keeping the file in `site/` makes the domain declarative and immune to
# it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
